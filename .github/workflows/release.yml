name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux (x64)
            platform: ubuntu-22.04
            args: ""
          - name: Windows (x64)
            platform: windows-latest
            args: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # `pec_ir` (the PEC payment-gateway client) is a git submodule.
          submodules: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: COMO Desk ${{ github.ref_name }}
          releaseBody: |
            COMO Desk ${{ github.ref_name }} for Windows, macOS (Intel and Apple Silicon), and Linux.

            Highlights:
            - POS sale requests now match the real terminal's expected traffic exactly: the extra merchant-title (T2) tag is dropped — every card charge sends only PR, AM, CU and PD, byte-identical to PEC_Tester_2022, which is what the device at 192.168.0.195 accepts.
            - POS wire format is regression-tested against frames captured from the live terminal, and the release pipeline builds into a draft that publishes once every platform has attached.

            Download the installer for your platform from the assets below. The installers are unsigned and may show the operating system's standard first-run security prompt.
          # Draft first: with `false`, the first matrix job to finish creates
          # the release and every other platform fails with "already exists"
          # (this killed the v1.7.0 and v1.8.0 Windows/Linux jobs). The draft
          # is published by the `publish` job below once all builds pass.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  release-publish:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Publish the drafted release
        uses: actions/github-script@v8
        with:
          script: |
            // Draft releases are not visible through get-release-by-tag, so
            // walk the list and take the draft that carries the tag.
            const tag = context.ref.replace('refs/tags/', '');
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const rel = releases.find((r) => r.draft && r.tag_name === tag);
            if (!rel) throw new Error(`No draft release for ${tag}`);
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: rel.id,
              draft: false,
            });
