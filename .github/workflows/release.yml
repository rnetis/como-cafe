name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux (x64)
            platform: ubuntu-22.04
            args: ""
          - name: Windows (x64)
            platform: windows-latest
            args: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # `pec_ir` (the PEC payment-gateway client) is a git submodule.
          submodules: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: COMO Desk ${{ github.ref_name }}
          releaseBody: |
            COMO Desk ${{ github.ref_name }} for Windows, macOS (Intel and Apple Silicon), and Linux.

            Highlights:
            - Customer care: automatic birthday, win-back and visit-milestone texts (opt-in for books created before this release, one text per guest per day, 12/day cap). Hand-sent birthday/quiet rounds now stamp the guests, so the automation never repeats them.
            - PEC card terminal bridge: correct reply framing, a 90 s card-sale timeout, and `pec-pos@0.1.0` / `pec-pcpos` resolve reliably in dev, Vercel and desktop builds.
            - SMS.ir fixes: the like-to-like endpoint spelling (`/v1/send/likeToLike`) and `lineNumber` sent as a string — personalised care rounds send again.
            - Safer data migration: existing SMS preferences are kept exactly as set.
            - Repo cleanup: Rust build artifacts no longer in the source tree.

            Download the installer for your platform from the assets below. The installers are unsigned and may show the operating system's standard first-run security prompt.
          # Draft first: with `false`, the first matrix job to finish creates
          # the release and every other platform fails with "already exists"
          # (this killed the v1.7.0 and v1.8.0 Windows/Linux jobs). The draft
          # is published by the `publish` job below once all builds pass.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  release-publish:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Publish the drafted release
        uses: actions/github-script@v8
        with:
          script: |
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.ref.replace('refs/tags/', ''),
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: rel.id,
              draft: false,
            });
